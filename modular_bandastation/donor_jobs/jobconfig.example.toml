# Пример настроек донатных профессий. Игра не загружает этот файл автоматически.
# Рабочий конфиг: config/jobconfig.toml (либо каталог, заданный серверу как config).
# В рабочем конфиге уже есть пустые DONOR_* секции. Копируйте нужные ключи
# ВНУТРЬ соответствующей существующей секции; не дописывайте этот файл целиком:
# повторное объявление той же TOML-таблицы недопустимо.
# Ключи с префиксом "# " в кавычках намеренно не применяются загрузчиком.
# Чтобы задать override, удалите этот префикс, например: "Total Positions" = 2.
# Значения по умолчанию объявлены в code/jobs/ этого модуля; явные настройки
# рабочего конфига имеют штатный приоритет. Карта также может задавать вакансии.
# Штатная команда Server -> Generate Job Configuration создаёт полный шаблон
# для включённых профессий, сохраняя действующие overrides рабочего конфига.
# DONOR_JOBS_ENABLED включает эти профессии; после изменения флага нужен restart.
# DONOR_PRISONER_GATE независимо задаёт Prisoner 3 roundstart / 5 total мест,
# если карта или активные ключи существующей секции [PRISONER] не задали другие.

[DONOR_BARBER]
"# Playtime Requirements" = 0
"# Required Account Age" = 0
"# Required Character Age" = 0
"# Spawn Positions" = 1
"# Total Positions" = 1

