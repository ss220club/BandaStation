name: Merge Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches: [master]

permissions:
  contents: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  merge_policy:
    name: Merge Policy
    runs-on: ubuntu-slim
    steps:
      - name: Forbid merge-blocking labels
        env:
          BLOCKING_LABELS: |-
            :clock1: На удержании
            :stop_sign: Do Not Merge
            :horse: Спорно
        run: |
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          blocking=$(grep -xFf <(printf '%s\n' "$BLOCKING_LABELS") <<< "$labels" || true)
          if [[ -n $blocking ]]; then
            echo "::error::PR #$PR has merge-blocking label(s): ${blocking//$'\n'/, }"
            exit 1
          fi
