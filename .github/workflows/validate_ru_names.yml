name: Translations

# TODO: uncomment push, pull_request, merge_group after merge in follow up commit
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - master
  #   paths:
  #     - "modular_bandastation/translations/code/translation_data/ru_names/**"
  # pull_request:
  #   branches:
  #     - master
  #     - "project/**"
  #   paths:
  #     - "modular_bandastation/translations/code/translation_data/ru_names/**"
  # merge_group:
  #   branches:
  #     - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ru_names
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download the scripts
        run: |
          wget -O tools/build/validate_ru_names.ts https://raw.githubusercontent.com/${{ github.repository }}/master/tools/build/validate_ru_names.ts
          wget -O tools/build/validate_ru_names.sh https://raw.githubusercontent.com/${{ github.repository }}/master/tools/build/validate_ru_names.sh
          wget -O tools/build/lib/ru_names.ts https://raw.githubusercontent.com/${{ github.repository }}/master/tools/build/lib/ru_names.ts
          wget -O tools/build/package.json https://raw.githubusercontent.com/${{ github.repository }}/master/tools/build/package.json
          wget -O tools/build/bun.lock https://raw.githubusercontent.com/${{ github.repository }}/master/tools/build/bun.lock

      - name: Setup Bun
        uses: ./.github/actions/setup_bun

      - name: Cache build tool dependencies
        uses: actions/cache@v5
        with:
          path: tools/build/node_modules
          key: ${{ runner.os }}-build-tools-${{ hashFiles('tools/build/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-tools-

      - name: Install build tool dependencies
        run: bun install --frozen-lockfile
        working-directory: tools/build

      - name: Validate ru_names
        run: bash tools/build/validate_ru_names.sh
