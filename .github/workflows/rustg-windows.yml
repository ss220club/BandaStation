name: Build patched Windows rust-g

on:
  push:
    branches: [vox-port]
    paths:
      - 'tools/rustg/build-windows.ps1'
      - 'tools/rustg/windows-lifetime.patch'
      - '.github/workflows/rustg-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Isolate build tool homes
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/rustg-cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:RUNNER_TEMP/rustg-rustup" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@1.93
        with:
          toolchain: 1.93.1
          targets: i686-pc-windows-msvc
      - name: Build exact source and local patch
        shell: pwsh
        run: ./tools/rustg/build-windows.ps1 -OutputDirectory "$env:RUNNER_TEMP/rustg-windows-output"
      - name: Upload candidate DLL and provenance
        uses: actions/upload-artifact@v7
        with:
          name: rustg-windows-i686-msvc
          if-no-files-found: error
          compression-level: 9
          path: |
            ${{ runner.temp }}/rustg-windows-output/rust_g.dll
            ${{ runner.temp }}/rustg-windows-output/manifest.json
            ${{ runner.temp }}/rustg-windows-output/windows-lifetime.patch
            ${{ runner.temp }}/rustg-windows-output/LICENSE.rust-g.txt
            ${{ runner.temp }}/rustg-windows-output/rust_g.dm
      - name: Upload matching private symbols
        uses: actions/upload-artifact@v7
        with:
          name: rustg-windows-i686-msvc-symbols
          if-no-files-found: error
          compression-level: 9
          path: ${{ runner.temp }}/rustg-windows-output/rust_g.pdb
