name: Merge Hold Assign

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [master]

permissions:
  contents: read

env:
  HOLD_LABEL: ":clock1: На удержании"
  GH_REPO: ${{ github.repository }}

jobs:
  merge_hold_assign:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-slim
    steps:
      - name: Check GitHub App configuration
        env:
          HAS_APP_ID: ${{ (vars.APP_CLIENT_ID || secrets.APP_ID) != '' }}
          HAS_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY != '' }}
        run: |
          if [[ "$HAS_APP_ID" != true || "$HAS_PRIVATE_KEY" != true ]]; then
            echo "::error::Merge Hold requires the Actions variable APP_CLIENT_ID (or legacy secret APP_ID) and the Actions secret PRIVATE_KEY."
            exit 1
          fi

      - id: create_token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID || secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Put the PR on hold
        env:
          GH_TOKEN: ${{ steps.create_token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --add-label "$HOLD_LABEL"
