author: "tgstation"
delete-after: True
changes:
  - bugfix: "Cable-based robotic limb repairs are no longer impossible while not wearing an uniform."
  - bugfix: "De-hardcoded HUDs for jobs & antags, report any icons missing."
  - bugfix: "Шина для ремонта роботизированных конечностей теперь возможна безнарушения формы."
  - balance: "Меню орбиты теперь должно отображать HUD-интерфейсы предателей, как и задумывалось изначально, вместо того, чтобы некоторые анты показывали только значок «rev»."
  - bugfix: "Венты шахт теперь корректно сбрасываются при потере."
  - balance: "Cosmic spell recharge condition changed to \"crit targets within a tile of a cosmic field\" instead of \"on a cosmic field\""
  - balance: "Orbit menu should now show antag HUDs as it was seemingly supposed to from the start, instead of some antags simply showing a rev icon."
  - bugfix: "Orbit menu should now show antag HUDs as it was seemingly supposed to from the start, instead of some antags simply showing a rev icon."
  - refactor: "ore vents now reset properly on losses."
  - bugfix: "Research discounts from toxins can now be purchased again."
  - balance: "Условие перезарядки космического заклинания изменено с «критические цели на космическом поле» на «критические цели в пределах одного тайла от космического поля»."
  - code_imp: "The logic for determining a discount has been cleaned up a bit."
  - rscadd: "Cosmic spell recharge condition changed to \"crit targets within a tile of a cosmic field\" instead of \"on a cosmic field\""
  - rscdel: "Убрано «захардкожено» HUD-дизайн для ролей и предателей. Сообщите, если какие-либо иконки отсутствуют."
  - rscadd: "Species features like wings and tails will appear \"meshed over\" when wearing certain equipment like spacesuits or biosuits."
  - rscadd: "Fixes space phase deducting a charge on entrance and edit. Now only deducts a charge on exit"
  - rscadd: "Исправлено: фаза пространства теперь списывает заряд только при выходе, а не при входе и редактировании."
  - spellcheck: "All heretic armor hoods are consistently known by their name, rather than \"ominous hood\""
  - refactor: "breaks up navigate code into a proc for the choice vs the line creation"
  - admin: "Magboots (and similar forms of gravity negation) prevent you from falling on shuttle movement"
  - balance: "Void spell recharge condition changed to \"Stand near freezing enemies\" instead of \"Crit freezing enemies\""
  - bugfix: "Магнитные ботинки (и подобные отрицанию гравитации) предотвращают падение при движении шаттла."
  - bugfix: "Условие перезарядки бездны изменено с «Критическое заморозка врагов» на «Стоять рядом с замёрзшими врагами»."
  - qol: "Pressing backspace while unfocused now clears your command bar."
  - qol: "Research discounts from toxins can now be purchased again."
  - rscdel: "Скидки на исследования за токсины теперь можно приобрести снова."
  - bugfix: "Anchored Items cant be looted with quick inserting from bags"
  - bugfix: "typepath suggestions are now filtered on the frontend"
  - qol: "Подсказки typepath теперь фильтруются на клиенте."
  - rscadd: "Added purple luxury medipens. These are given instead when bought with a jellyperson's bank account. They are jelly-friendly, however heal less than normal luxury pens. They also make you more purple. Sprite by Bieyes."
  - rscadd: "Костюмы-костюмы больше не полностью скрывают хвосты ящеров."
  - admin: "Spacesuits no longer fully conceal lizard tails"
  - balance: "Other apes, like gorillas, can have fun popping balloons with foam darts as well. They can also perform some monkey emotes now."
  - code_imp: "Species features like wings and tails will appear \"meshed over\" when wearing certain equipment like spacesuits or biosuits."
  - code_imp: "Эволюционные особенности, такие как крылья и хвосты, будут отображаться «поверх» при надевании определённого оборудования, такого как костюмы или биокостюмы."
  - code_imp: "Cleaned up code that prevents tinfoil hats from being equipped on throw. Report any oddities"
  - code_imp: "Biosuits and beepeeker suit sprites now altar when worn by digitigrade mobs."
  - code_imp: "Спрайты биокостюмов и костюмов beepeeker теперь «альтерируются» при надевании цифигридальными мобами."
  - admin: "Painting and Trophy manager no longer permanently deletes itself after the first close"
  - bugfix: "Логика определения скидки немного упрощена."
  - qol: "Upon scanning a target with a gas analyzer, its UI will update constantly as the target's gas mixture changes (so long as you stay in range). No more spam clicking to see the status of your gas canister."
  - qol: "Aprons and Overall sprites now altar when worn by digitigrade mobs."
  - spellcheck: "Спрайты фартуков и комбинезонов теперь «альтерируются» при надевании цифигридальными мобами."
  - spellcheck: "Grammar pass on a lot of atmos related content."
  - spellcheck: "All heretic armor hoods are consistently known by their name, rather than \"ominous hood\""
  - spellcheck: "Все капюшоны ереси теперь одинаково называются по своему имени, а не «зловещим капюшоном»."
  - spellcheck: "Antinoblium renamed to Anti-Noblium"
  - refactor: "The double-ended chainsaw spear"
  - refactor: "Двухсторонний расческа-ставня."
  - qol: "Gas chamber UIs now default to showing information pertaining to whichever gas is held within"
  - qol: "The Captain is now treated as a member of every department, for the purpose of department-related vendor discounts."
  - bugfix: "The logic for determining a discount has been cleaned up a bit."
  - bugfix: "Капитан теперь считается членом каждого отдела для целей скидок у продавцов."
  - spellcheck: "fixes a typo in diluted regenerative jelly description"
  - bugfix: "Donk. Flechette rounds aren't stealthy embeds and can be hand removed"
  - bugfix: "Face decals (like pie) now appear on monkeys' faces instead of above it"
  - rscadd: "Donk. Пули типа «флешет» не являются стелс-вшивками и могут быть удалены вручную."
  - rscdel: "Miners no longer spawn with marker beacons"
  - balance: "Humans can take CSL"
  - balance: "люди могут принимать CSL."
  - rscadd: "Admin VV topic to navigate a player to a marked object"
  - rscadd: "breaks up navigate code into a proc for the choice vs the line creation"
  - rscadd: "разделяет код навигации на отдельную процедуру для выбора vs создания линии."
  - refactor: "Fucked with how space parallax/the renderer thinks about \"where\" it is being displayed pretty heavily. Please report any weird visuals!"
  - bugfix: "Админ-тема VV для навигации игрока к помеченному объекту."
  - code_imp: "Adds support for pre-sawnoff guns and cleans up sawnoff behavoir"
  - rscadd: "AI tracking from the crew monitoring console now works for people who have set an ID card honorific too"
  - rscadd: "Отслеживание ИИ с консоли мониторинга экипажа теперь работает для людей, у которых установлен почётный титул на ID-карте."
  - code_imp: "Vampire fangs now handle all vampire blood-draining effects."
  - rscadd: "Pressing backspace while unfocused now clears your command bar."
  - image: "Нажатие Backspace при потере фокуса теперь очищает строку команд."
  - bugfix: "Parallax draws as expected again"
  - bugfix: "Строка команд теперь начинается с «Say», а не с режима «Command»."
  - bugfix: "The Command bar now starts on Say instead of Command mode."
  - refactor: "Refactored the code for damage and types of damage a little (also armor but not as much). Make sure to report any oddity with it."
  - bugfix: "Goldgrub no longer reproduce unless hand fed ores"
  - bugfix: "Anchored Items cant be looted with quick inserting from bags"
  - rscadd: "Золотограб не размножается без ручного кормления рудой."
  - qol: "Atmos mix tank output starts disabled."
  - bugfix: "Закреплённые предметы нельзя вынуть быстрой вставкой из мешков."
  - qol: "Command bar's last used mode is now persistent between rounds."
  - bugfix: "Chat Highlight sounds are off by default now."
  - code_imp: "Звуки подсветки чата выключены по умолчанию."
  - bugfix: "Atmos multi-z pipes rendering weirdly when connecting with omni-pipes"
  - bugfix: "Chat Highlights won't trigger on self-actions or radio channel names."
  - bugfix: "Подсветка чата не срабатывает при самодействиях или названиях радиоканалов."
  - qol: "Thermo machines input pipe takes on pipe color (visually, mechanically no changes)"
  - qol: "Added purple luxury medipens. These are given instead when bought with a jellyperson's bank account. They are jelly-friendly, however heal less than normal luxury pens. They also make you more purple. Sprite by Bieyes."