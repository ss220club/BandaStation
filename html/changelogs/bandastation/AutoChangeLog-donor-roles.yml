author: "PhantornRU"
delete-after: True
changes:
  - rscadd: "Добавлены 22 донатные профессии со штатной экипировкой BandaStation, варианты должностей и бесплатный вариант грузчика «Доставщик». Prisoner расширяется отдельной настройкой."
  - qol: "Настройки профессий и поздний вход показывают выбранный профиль персонажа, вариант должности и причину недоступности."
  - bugfix: "Стартовая наличность сначала помещается в личную сумку; чужая стопка на точке входа не перехватывает выдачу."
  - bugfix: "Сброс назначения профилей очищает единую карту назначений. Закрытые донатные вакансии не блокируют запасной вход в заполненный Assistant."
  - bugfix: "При отказе старта Dynamic отменяет предварительный выбор и связанные ограничения, сохраняя чужие назначения."
