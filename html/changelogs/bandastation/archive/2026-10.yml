      с флагом гордости и коробатыми трусами с союзным флагом.
  - bugfix: Киборги чисто отключаются от удалённых ИИ, сохраняя RoboTact пригодным
      для использования с собственными фотоаппаратами.
  - bugfix: Кошмарный дом больше не удаляет кошек, среди прочих улучшений.
  - bugfix: Связанные с ремнями предметы больше не тормозят сервер, когда их владелец
      проходит через вентиляцию или утилизаторы. Предмет теперь путешествует вместе
      с владельцем в вентиляцию, утилизаторы, шкафы и мехи.
  - bugfix: Цепь связанного предмета больше не растягивается по всей карте, когда
      владелец находится внутри чего-либо.
  - bugfix: Связанные с ремнями предметы на полу плавно следуют за владельцем.
  - bugfix: Вы можете удалить связанный с ремнями предмет с чужого персонажа из меню
      снятия, когда он не находится в их руках.
  - bugfix: 'Только для обнажённых: связанные с ремнями предметы не могут входить
      в вентиляцию, пока связаны с другим предметом.'
  - admin: Принудительный вызов резонансного каскада больше не нарушает целостность
      расчётов кристалла суперматерии или не превращается в обычный взрыв, если кристалл
      заживает.
  - balance: Станционные инженеры теперь начинают с изолирующих перчаток.
