  - rscadd: Можно получить бессмысленные награды за выполнение нескольких новых задач
  - balance: Все органы скелетов теперь считаются "минеральными" органами, что препятствует
      действию большинства химикатов
  - balance: Все органы плазмаменов теперь "органические + минеральные", снова позволяя
      большинству химикатов работать с ними
  - bugfix: Обеспечивает правильное отслеживание ДНК родителя для частей тела
  - bugfix: Исправлен потенциальный жёсткий удаление (hard del) медиботов
  - code_imp: Экран завершения раунда теперь логирует количество открытой игроками
      почты в течение смены.
  - bugfix: Ползунок громкости музыкальных инструментов теперь работает как задумано
  - admin: Администраторы могут отключать события в панели событий
  - rscadd: Рог эндулера теперь имеет эмиссионный эффект
  - image: Изменены усы лizard на верхний/западный слой иконок над шляпами
  - bugfix: Исправлено логирование для грузовых ящиков и запросов грузовых ящиков
      по должностям
  - bugfix: Диск "Детоматикс" теперь действительно отправляет поддельные сообщения
  - rscadd: ИИ теперь может видеть эмоции через камеры
  - bugfix: Исправлено, что обувь и некоторые другие предметы не моющиеся
  - bugfix: Кибернетические клыки используют правильный металлический визуальный стиль
