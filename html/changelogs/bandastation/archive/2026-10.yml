  - bugfix: Исправлено, что билеворм не запускало ошибку при переваривании
  - bugfix: Исправлено, что гигантореки не совершают свою финальную атаку при смерти
  - bugfix: Исправлен потенциальный запуск ошибки при использовании плазмореза как
