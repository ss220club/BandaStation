  - rscadd: Добавлено снаряжение оперативников специальных операций.
  - bugfix: Починено отсутствие спрайта при смене скина для GP-9
  NatWak:
  - rscadd: Добавлено зимнее пальто для представителя Нанотрейзен в его сумку с одеждой.
      Имеет свой новый спрайт.
  - spellcheck: Электро-посох теперь не будет всегда начинаться с заглавной буквы.
  PetyaFX:
  - admin: Уведомление в лобби теперь можно сохранять между раундами.
  tgstation:
  - bugfix: У токсинов кило теперь есть голо вентилятор :D
