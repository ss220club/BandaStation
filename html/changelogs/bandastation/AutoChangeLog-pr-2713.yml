author: "tgstation"
delete-after: True
changes:
  - bugfix: "Исправлены очки ночного видения."
  - bugfix: "Стены и окна в безопасном доме для битраннеров больше не пытаются подключиться к стенам, которые ещё не существуют."
  - bugfix: "Атмосферные машины, уничтоженные взрывами, теперь высвобождают газ внутри них, вместо того чтобы иногда удалять его."
  - bugfix: "Термоэлектрические генераторы-циркуляторы (как горячие, так и холодные) больше не удаляют газ внутри них при разрушении или демонтаже. Газ теперь попадает в подключенные трубы, или на пол, если они не подключены."
  - bugfix: "Исправлено, когда очки продавца застревали в имитации отсутствия санитарного состояния предыдущего носящего."
  - code_imp: "Очистка кода упражнений — значение `null`."
  - bugfix: "Большие манипуляторы больше не будут пытаться использовать предметы, которые их обезьяна не смогла подобрать."
  - bugfix: "Исправлена проблема, когда выкрученная патронт в пистолете могла оставаться квантово запутанной с оружием."
  - rscadd: "Добавлен новый вид игрока: Синерокс!"
  - rscadd: "Гидро-вапоризатор, носимое устройство, функционирующее как баллон с запасом газа, но для водяного пара."
  - rscadd: "Новая лёгкая/двухчеловеческая команда пиратов — Сирены Шимаи."
  - rscadd: "Компактный лазершотган для указанной выше пиратской команды."
  - rscadd: "Бронированная кожаная куртка для указанной выше пиратской команды."
  - code_imp: "Обновлённые виды получили код, который позволяет им точно определять, когда регенерировать ранее потерянные конечности (#92712)."
  - code_imp: "Добавлена процедура для кода экипировки, позволяющая экипировать предметы после основного снаряжения вида."
  - balance: "Коляски стали несколько быстрее."
  - rscadd: "Новый удобрение в вашем местном биогенераторе — Химо Культивейт. Уменьшает сорняки, уменьшает продолжительность жизни и выносливость растений. Используйте с осторожностью."
  - rscadd: "Новое удобрение в вашем местном биогенераторе — Стабили Фид. Уменьшает нестабильность, есть шанс уменьшения признаков и реагентов растений. ИСПОЛЬЗУЙТЕ С ОСТОРОЖНОСТЬЮ."
  - balance: "Прирост выносливости Enduro Grow за единицу за цикл увеличен с 0.35 до 0.5."
  - refactor: "Множество кода, связанного с руками, было изменено по техническим причинам, что решило следующие проблемы:"
  - bugfix: "Штраф за стиль Sleeping Carp не игнорировал \"крутые\" находящиеся в руках предметы."
  - bugfix: "Проклятый меч не мог использоваться для связывания призрачного длинного меча."
  - bugfix: "Янтарный фокус не мог использоваться для связывания призрачного длинного меча."
  - bugfix: "Предметы, которые могли блокировать, не блокировали корректно попытки толчка/перешаркивания."
  - bugfix: "Обучающий раздел swap_hands не учитывал 3 и более рук."
  - bugfix: "Высокотяние моба не учитывало более 2 рук (теперь можно высокотянуть до 20!)."
  - refactor: "Отделены визуалы освещения от компонента/отображения освещения на трафике."
  - bugfix: "Рыбы больше не могут дышать воздухом благодаря истории курения никотина."
  - bugfix: "Рыбы не могут быть паразитами."
  - bugfix: "Исправлено, когда ящики и кровати теряли свою высоту после перемещения на шаттле."
  - bugfix: "Некоторые мобы, такие как Майго, Существа и пустые тела, теперь корректно атакуют вас и препятствия на пути."
  - bugfix: "Исправлено, когда освещение создаётся дважды на некоторых плитах во время запуска раунда."
  - qol: "ИИ и киборги могут регулировать масштаб фотоаппаратов."
  - bugfix: "Масштаб пAi photo больше не сломан."
  - refactor: "Вы теперь можете закрепить хвост корги из игры \"Приклей хвост на корги\" на любой объект."
  - qol: "Комплект \"Приклей хвост на корги\" включает в себя 1 постер, 4 булавки и 1 повязку для глаз."
  - rscadd: "Восемь новых коктейлей из залов Мансуса теперь доступны для смешивания и наслаждения (на ваш страх и риск)."
  - bugfix: "Исправлено, когда шанс ранения ног при падении на з-уровни увеличивался по мере падения на большее количество уровней."
  - bugfix: "Колосс больше не злится при виде Голема без причины."
  - bugfix: "Големы, которые едят камни, теперь выглядят соответственно, как и должны."
  - bugfix: "Яйца раптора, не отложенные раптором (на карте или созданы), теперь вылупятся в настоящего цыплёнка вместо багнутого невидимого."
  - bugfix: "Персонажи с анонимной темой и appearance-баном теперь получают случайный набор личностей вместо случайного набора, добавленного к их собственным."
  - bugfix: "Случайные личности больше не могут иметь две противоречивые друг другу, такие как преданный и разочарованный."
  - rscadd: "Рыбы могут переключать морды во время создания персонажа (так же, как они могут переключать щетинки)."
  - bugfix: "Рыбы не могут быть такими тёмными, как бездна."
  - rscadd: "Добавлены эффекты ЭМП на термомашины, портативные баллоны, лампы, фонари, напольные лампы, прожекторы, огнёмёты на оружии, лампы на шлемах плазменцев, лампы на шлемах, фонари ПДА, шахтные шкафы, кнопки, контроллеры турелей, телепортационные маяки, люки и лотки для трупов. Также улучшено логирование администраторов для атмосферных эффектов ЭМП."
  - rscadd: "Добавлена защита от ЭМП на фонариках с ЭМП."
  - rscadd: "Флаеры, свечи, светящиеся из слизи предметы и светящиеся палочки больше не проводят электричество напрямую."
  - rscadd: "Ножи наносят дополнительный урон, если вы сначала схватите цель в руки."
  - rscadd: "Некоторые ножи можно проткнуть в кого-то с помощью правой кнопки мыши."
  - balance: "Кухонные ножи и шилы имеют поведение встраивания."
  - balance: "Большинство ножей имеют лучшие шансы на встраивание. Только боевые ножи имеют особенно смертоносные эффекты встраивания."
  - bugfix: "Обезьяны больше не вынимают оружие из ваших рук или с вашего спины, когда вы подобрали его раньше, чем они добрались до него."
  - bugfix: "Органы, отвечающие за чувство вкуса рыбьих инфузий, теперь лучше привлекают внимание к себе, и язык совы делает яичницу и мышей вкуснее, как и задумано."
  - bugfix: "Обработка вопроса о том, как сделать контакт глазами, стала более надёжной."
  - bugfix: "Некоторые тексты при осмотре эффектов глаз действительно проверяют, есть ли у вас глаза."
  - rscadd: "Сварка влияет на соседних мобов, которые не имеют защиты для глаз. Специальные сварочные инструменты, такие как экспериментальный сварочный аппарат СЕ или чужой сварочный объект, могут безопасно игнорировать причинение вреда соседним мобам."
  - qol: "Добавлено несколько новых клавиш для управления руками."
  - qol: "Клавиши для рук были перенесены в категорию \"Ловкость\"."
  - bugfix: "Переключение рук могло застрять на предметах в offhand вместо пропуска их."
  - bugfix: "Ловля теперь пытается поместить пойманные предметы во все возможные открытые руки, а не только в активную offhand."
  - bugfix: "Поведение захвата Tentacle имело странное поведение, которое заставляло его игнорировать множество систем."
  - rscadd: "Добавлены формы судебного разбирательства в пустые формы в фотокопире."
  - bugfix: ",Возможно, исправлено освещение."
  - bugfix: "Длинный копьё Giantslayer показывает, когда экипировано в хранилище костюма. Наслаждайтесь своими образами охотника за монстрами."
  - qol: "Действие по умолчанию Precise Drop теперь CtrlQ вместо CtrlX, чтобы соответствовать Drop, где Q опять стало основной клавишей."
  - bugfix: "Гармошки и наушники снова воспроизводят музыку при экипировке."
  - bugfix: "Исправлено, когда сумки с рудой выбрасывали ошибки при входе и выходе из шкафов/контейнеров или при выбрасывании внутри них."
  - bugfix: "Управление развёрнутой турелью снова даёт вам её контролы в руках."
  - bugfix: "Ручной режим огнестрельного излучателя прототипа снова даёт вам его контролы в руках."
  - bugfix: "Сетчатые сеты и проклятие voidwalker теперь полностью покрывают большие крылья, вместо того чтобы пропускать левую сторону и края."
  - bugfix: "Роба \"нок\" больше не скрывает хвосты ящеров и антенны рыбьих мотыльников."
  - bugfix: "Исправлена кнопка сохранения в блокноте NTOS, которая ничего не делала."
  - bugfix: "АПЦ корректно вращаются вместе с шаттлами."
  - bugfix: "Сети кабелей на шаттлах теперь поддерживают более корректные соединения."
  - bugfix: "Подкомнаты на шаттлах больше не имеют бесплатного питания."
  - bugfix: "ИИ, пытающийся уничтожить препятствия, не будет стрелять в случайных других мобов."
  - bugfix: "ИИ больше не видит свои глаза после возрождения."
  - bugfix: "Вторые глаза ИИ удаляются при смерти или при загрузке на карту."
  - bugfix: "Ползание по вентиляции снова показывает только трубы и макет окружающей области, а не мобов и объекты в ней."
  - bugfix: "Инженеры-киборги на шаттле и шахтеры-киборги вспоминают тёплое зрение и термальное зрение синдиката-саботёров-киборгов снова окрашивают тёмные участки."
  - bugfix: "Саботёры-киборги Синдиката снова могут выключить тёплое зрение."
  - bugfix: "Сканер-гогглы инженера дают только тепловое зрение в режиме \"Mезон\" снова. Сканеры региона на шаттле, термические тепловые очки атмосферы и админские goggles больше не дают тепловое зрение вообще."
  - bugfix: "Исправлено, когда рапторы не наследовали модификации статистики пищи родителей."
  - bugfix: "Исправлено, когда атака щупалом могла поставить в очередь несколько атак и убить мобов за один удар."
  - bugfix: "Исправлено, когда функция \"бесперевой дыхание\" фактически давала пользователю возможность не дышать."
  - bugfix: "Исправлено множество ошибок при выбрасывании содержимого микроволновой печи."
  - bugfix: "Яблоки, шляпы-грибы, семена сторчистеля и случайно-мутированные культуры теперь помещаются в сумки для растений при сборе урожая."
  - bugfix: "Исправлено, когда шахтёры не имели доступа к двери ORM на Килостанции."
  - balance: "Мегафауна / Щупальцы предотвращают возрождение шахтных мобов в радиусе 10 / 7 тайлов во время бури."
  - balance: "Радиус, в котором канделябры блокируют возрождение шахтных мобов во время бурь, теперь достигает через стены."
  - balance: "Живые игроки предотвращают возрождение шахтных мобов в радиусе 3 тайлов во время бури (если точка возрождения находится в поле зрения)."
  - bugfix: "Ловля баскетбола и его прокачка больше не оставляют фантомный мяч в другой руке."
  - bugfix: "Баскетбол, который вы отпустили, больше не продолжает прыгать, когда вы идёте, или не тянется к вам, когда вы падаете."
  - bugfix: "Если вы держите два баскетбола и бросаете один, тот, который остался в руке, теперь делает прокачку."
  - bugfix: "Пирофобия теперь накапливает страх при пожаре, когда нет галлюцинации огня."
  - bugfix: "Рецепт \"Быстрый лезвия\" больше не имеет глупого пересечения с \"Надувной\", и вместо этого теперь использует его как ингредиент."
  - rscadd: "Эфирные игроки теперь могут надевать бельё в меню персонализации персонажа! Теперь вы тоже можете произвести впечатление на своих друзей своими носками с флагом гордости и коробатыми трусами с союзным флагом."
  - bugfix: "Киборги чисто отключаются от удалённых ИИ, сохраняя RoboTact пригодным для использования с собственными фотоаппаратами."
  - bugfix: "Кошмарный дом больше не удаляет кошек, среди прочих улучшений."
  - bugfix: "Связанные с ремнями предметы больше не тормозят сервер, когда их владелец проходит через вентиляцию или утилизаторы. Предмет теперь путешествует вместе с владельцем в вентиляцию, утилизаторы, шкафы и мехи."
  - bugfix: "Цепь связанного предмета больше не растягивается по всей карте, когда владелец находится внутри чего-либо."
  - bugfix: "Связанные с ремнями предметы на полу плавно следуют за владельцем."
  - bugfix: "Вы можете удалить связанный с ремнями предмет с чужого персонажа из меню снятия, когда он не находится в их руках."
  - bugfix: "Только для обнажённых: связанные с ремнями предметы не могут входить в вентиляцию, пока связаны с другим предметом."
  - admin: "Принудительный вызов резонансного каскада больше не нарушает целостность расчётов кристалла суперматерии или не превращается в обычный взрыв, если кристалл заживает."
  - balance: "Станционные инженеры теперь начинают с изолирующих перчаток."