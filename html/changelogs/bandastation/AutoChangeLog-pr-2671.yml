author: "tgstation"
delete-after: True
changes:
  - qol: "Объекты в панеле добычи можно использовать, находясь в горизонтальном положении."
  - qol: "Объекты в панеле добычи можно использовать на расстоянии, если у вас есть телекинез или оружие с длинным радиусом."
  - qol: "Мобы, находящиеся в слепоте, снова видят имена в панели добычи, но панель автоматически закрывается при удалении более чем на два тайла."
  - bugfix: "Кабели теперь корректно скрываются за окнами или шлюзами."
  - rscdel: "Компьютеры управления больше не имеют вкладки «Эксперименты», если на станции нет исследовательских серверов."
  - qol: "Изменены эмодзи «thumbs up/down» и «scratch head» при ручном вводе на thumbsup, thumbsdown и scratchhead."
  - rscadd: "Теперь вы можете просматривать содержимое чужого рюкзака через меню снятия, не снимая рюкзак. Это занимает немного больше времени, чем полное снятие рюкзака, и предупреждает носильца, что вы «ковыряетесь в их вещах» (если они сознаютны)."
  - rscadd: "Вложенные хранилища (например, коробка в сумке или бутылка с таблетками в медките) теперь получают элемент интерфейса на полосе хранилища, позволяющий переходить к родительскому хранилищу, что позволяет легко перемещаться между уровнями хранилищ без необходимости начинать с самого начала."
  - rscadd: "Карго теперь может закупить ящик «садоводство» на широких спектральных каналах, заполненный косоворотами и факелами."
  - bugfix: "Исправлено: индикаторы прогресса больше не мигают красным после завершения."
  - bugfix: "Слизни теперь правильно передают фракции и союзников своим детёнышам."
  - code_imp: "Улучшена кодовая часть для лучшего обнаружения «страйч-жокетов» в коде сопротивления кандалы."
  - bugfix: "Промышленные отходы теперь используют общие частицы для обработки."
  - bugfix: "Промышленные отходы больше нельзя дублировать."
  - rscadd: "Добавлены всплывающие подсказки для иконок языков в чате."
  - rscdel: "Удалены множество неиспользуемых и нессыланных ресурсов из игры."
  - rscadd: "Некоторые ошейники теперь могут быть прикованы к вашей руке."
  - rscadd: "PLANKMAN-тип портативного генератора! Теперь вы можете сжигать древесину для получения энергии!"
  - bugfix: "Исправлено: элементы пути движения ботов не отображаются."
  - rscadd: "Карго теперь может закупить совершенно новый наномузыкальный бумбокс! В комплекте один демо-касет. Два дополнительных диска продаются отдельно (в качестве дополнений)."
  - rscadd: "Добавлена каталог «знакомой» музыки в премиальные товары игровых продавцов."
  - rscadd: "Добавлена редкая каталог в чёрном рынке."
  - rscadd: "Добавлена редкая каталог в качестве вторичной награды за битраннинг."
  - rscadd: "Постеры в стиле «пин-ап»."
  - rscadd: "Добавлено 3 новых мутации кудзу — скользкая, радиоактивная и проводящая."
  - rscadd: "Папоротник-хищник унаследует мутации кудзу, которые могут быть полезными или вредными, и влияют на статы, способности и т.д."
  - balance: "Уменьшено здоровье и регенерацию папоротника-хищника вдвое. Папоротники больше не могут перемещаться за пределы папоротники без получения урона, если только у них нет мутации «агрессивное распространение»."
  - rscadd: "Препарат «herbicide»/«Plant-B-Gone» мгновенно уничтожает пришельские сорняки."
  - rscadd: "Гранаты с herbicide теперь используют химическое вещество herbicide и не Plant-B-Gone."
  - balance: "Уменьшен урон от Plant-B-Gone против кудзу и растений вдвое."
  - bugfix: "Исправлено: мутация «укреплённый кудзу» не давала 50% сопротивления острым предметам."
  - bugfix: "Исправлено: мутация «шипы кудзу» не реагировала атаками игроков."
  - qol: "Добавлены блоки описания для спаунеров призраков папоротника-хищника, включающие их наследуемые мутации."
  - image: "Добавлено 4 новых костюма для пилотов мехов, доступных для закупки в карго!"
  - bugfix: "Возвращено иконка tg, которая загадочно исчезла на пару дней."
  - spellcheck: "Исправлено описание кровавого пятна: «Это пятно крови» вместо «Это какое-то пятно крови»."
  - refactor: "Изменён способ обработки ChangeTurf() для сигналов регистрации. Пожалуйста, сообщайте о любых странных проблемах с объектами, которые обычно реагируют при входе на определённые тайлы (нагревание, издавание звука бананиума, поджигание лавой и т.д.)."
  - bugfix: "Исправлено: ошибка времени выполнения случайного подбрасывания поставки для карго."
  - rscdel: "Игрушечное оружие больше не имеет косметических эффектов отдачи."
  - balance: "Мечи из бананиума теперь скользят, особенно в руках клоунов."
  - balance: "Щиты из бананиума теперь скользят, особенно в руках клоунов."
  - balance: "Изменены некоторые предметы и товары в костюме и аплоуде клоун-оперативника."
  - balance: "Броня простых мобов теперь даёт линейно масштабируемое снижение урона от бомб вместо случайного шанса снижения урона."
  - bugfix: "Иммунитет к бомбам работает для простых мобов."
  - bugfix: "Броня простых мобов теперь защищает их от разрывания взрывами."
  - code_imp: "Код брони простых мобов стал менее повторяющимся."
  - bugfix: "Исправлено: проблема, которая могла привести к полному выключению холодильника на всю игру."
  - bugfix: "Исправлено: у пауков-пауков суперматерии не было иммунитета к паутине."
  - bugfix: "Радио и развлекательные субтитры больше не отфильтровываются локальным чатом."
  - qol: "У всех мехов теперь есть переключатель для сокращения панели модулей в интерфейсе меха."
  - qol: "Мехи теперь показывают процент перегрузки без необходимости активировать её."
  - spellcheck: "При осмотре мехов теперь текст состояния целостности форматируется так же, как и при разрушении других объектов."
  - rscadd: "Добавлены ссадины на руки, если вы атакуете людей в состоянии приближающейся смерти. Они отображаются в автопсиях."
  - rscadd: "Добавлены: фонарастики, позднозимние цветы, варехжии, иностранцы, плазменные цветы и тройски болотника как ледяная флора и растения для ботаники."
  - rscadd: "Добавлены следующие химикаты: гидроферрутиановый глицерин (встречается в фонарастиках) и токсин берсерк (встречается в варехжиях)."
  - rscadd: "Добавлены: батоны питания, суп из кускуса, борщ из снежного дракона, рагу из волка, барбекю из снежного дракона, праздник убийцы венджо и разбивание льда в качестве кушанных рецептов."
  - rscadd: "Добавлены: зубная нить (из ферментированных иностранцев), сильная зубная нить, крепкий пивной крем, ледяной дев, репка-ядерка, ледяной клад и напитки из ледяного морского светильника."
  - bugfix: "Исправлено: турбинa газа Kilo сжигала атмосферу при использовании."
  - image: "Добавлены иконки для дости «Я был подростком-анархистом», «Новый мир в чаше» и «Как поменять руки???»."
  - rscadd: "Добавлено функциональное задержание огня для пистолета «Сжиматель» абдуктора."