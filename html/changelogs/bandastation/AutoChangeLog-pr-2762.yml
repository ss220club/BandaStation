author: "tgstation"
delete-after: True
changes:
  - bugfix: "Жалящие трансформации генокрада теперь корректно проходят через 8 минут."
  - bugfix: "Теперь можно помещать трупы в мешках в утилизаторы, находясь пристегнутым к креслу или иным образом зафиксированным."
  - balance: "Использование стетоскопа теперь занимает 2 секунды."
  - bugfix: "Исправлено отображение погодных частиц."
  - balance: "Кровавые черви имитируют дыхание при проверке стетоскопом."
  - bugfix: "Кровавые черви перезапускают сердце носителя при его оживлении."
  - rscadd: "Вдыхание, инъекция или употребление металгена теперь воздействует на ваши легкие, печень или желудок соответственно."
  - qol: "Атмосферные техники теперь начинают раунд с чипом навыков атмосферы, который позволяет им видеть провода пожарной и воздушной сигнализации."
  - qol: "Чип навыков инженерии теперь также позволяет видеть провода пожарной сигнализации."
  - bugfix: "Настенные объекты, слой которых выше игроков, теперь будут отображаться под игроком, если тот прислонится к ним."
  - balance: "Демон: «кровавое ползание» теперь наносит урон при использовании."
  - balance: "Демон: теперь может поедать только углеродных людей."
  - bugfix: "Исправлено зацикливание фоновых звуков в запитанных зонах, где нет АПЦ."
  - bugfix: "Исправлена ошибка выполнения (runtime) при входе киборга или ИИ в раунд."
  - bugfix: "Исправлено отсутствие шеврона командования в манифесте экипажа."
  - bugfix: "Исправлено отсутствие иконок должностей в консоли записей службы безопасности."
  - rscadd: "Шеф-повара теперь могут готовить новый суп — Насыщенный грузовой бульон! Не забудьте дождаться, пока бульонный кубик станет жидким."
  - qol: "Добавлены эмоции *stammer / *stutter (заикание) и *slur (невнятная речь), которые заставляют ваши следующие несколько сообщений выглядеть заикающимися (как при ранении) или невнятными (как при опьянении). Опционально можно ввести *[эмоция] [число], чтобы определить длительность эффекта в секундах (значение ограничено, не пытайтесь ставить слишком много)."
  - qol: "Добавлен эффект *jitter, который заставляет вашего персонажа дрожать (спрайт начинает дергаться взад-вперед). Опционально можно ввести *jitter [число], чтобы определить длительность дрожи в секундах (значение ограничено, не пытайтесь ставить слишком много)."
  - rscdel: "Предатели, Кровавые Братья, Шпионы и Генокрады больше не могут захватить аварийный шаттл, если у них нет соответствующей цели или они не установили ее вручную."
  - rscdel: "Еретики больше не могут захватить шаттл, пока не вознесутся или не установят цель вручную."
  - balance: "Шанс выпадения цели «захват шаттла» для Предателей, Кровавых Братьев и Шпионов немного увеличен."
  - balance: "Генокрадам теперь редко может выпасть цель «захват шаттла»."
  - qol: "Цели шпионов были в целом переработаны, чтобы исключить бессмысленные комбинации."
  - bugfix: "Исправлен индикатор виртуального ввода текста."
  - map: "Метастанция: некоторые напольные светильники, которые были скрыты за стульями, перенесены на стены."
  - bugfix: "Вы больше не можете переложить «горячую картошку» на обезьяну или человека в критическом состоянии."
  - qol: "Радиационные щиты теперь накапливают собранный тритий внутри, который можно извлечь через подключенную трубу. Учтите, что внутренний накопитель не бесконечен и имеет лимит давления — при его превышении тритий начнет утекать в воздух."
  - qol: "Аварийные радиационные щиты теперь также генерируют тритий со временем (который также хранится внутри)."
  - bugfix: "Исправлена проблема, при которой TGUI-ввод, открывающий другой интерфейс того же типа (например, «Перейти к координате»), просто закрывался, если выбрать опцию слишком быстро."
  - rscadd: "В пре-гейм лобби теперь отображается примерный вид того, как может выглядеть манифест экипажа."
  - bugfix: "Исправлена попытка больших манипуляторов взаимодействовать с подпольными трубами."
  - bugfix: "Исправлен квирк «Гетерохромия»: теперь можно настраивать цвет, и он корректно появляется при генерации."
  - bugfix: "Бумбоксы, бензопилы и другие зацикленные звуки теперь следуют за тем, кто их несет; длинные звуки возобновляются с нужного момента при возвращении в зону слышимости вместо того, чтобы затихать."
  - bugfix: "Эффект «крованого опьянения» больше не оставляет постоянной резистентности к выносливости и повышенного урона от давления после завершения действия."
  - bugfix: "Снова работает сопротивление зомби к оглушению."
  - bugfix: "Сопротивление и уязвимость «брута» больше не применяются дважды к урону от давления."
  - bugfix: "Прерывание процесса зарывания садового гнома больше не увеличивает навсегда получаемый им урон."
  - bugfix: "Извлечение сердца таракана из нечеловека больше не дает бесплатного сопротивления к сбиванию с ног."
  - bugfix: "Лечение животных теперь мгновенно обновляет их здоровье."
  - bugfix: "Резистентности и уязвимости к «бруту» и ожогам теперь полностью применяются к урону, распределенному по всему телу (например, к урону от давления)."
  - bugfix: "Исправлена ошибка, при которой стили лодаута, меняющие название предмета, не применялись при спавне."
  - balance: "Еретики «Пир Сов» больше не теряют свойство «поломка клинка» и не получают бесконечные клинки после достижения определенного порога знаний."
  - balance: "Броня еретика больше не скрывает ауру."
  - balance: "Еретики-замки немного изменились: теперь вы получаете ауру, но она проявляется ТОЛЬКО при ношении мантии и не светится в темноте."
  - bugfix: "Потеря свойства «поломка клинка» больше не снимает «плащ теней» (так как это больше не врожденное заклинание)."
  - bugfix: "Оглушение в момент воспроизведения строки TTS больше не выключает все звуки игры до перезапуска."
  - bugfix: "Заряды МОБ и транспортные трубы больше не становятся мгновенными, если раунд длится несколько часов."
  - balance: "Горящий фонарь был переработан в Lumen Mendax."
  - balance: "Lumen Mendax поглощает стаки огня с еретика для получения энергии; при максимальном заряде он может вызвать вспышку, которая ослепляет неверных и вызывает у них галлюцинации, одновременно активируя механику перезарядки пеплом."
  - image: "Новый спрайт для Lumen Mendax."
  - bugfix: "Парирование чужого снаряда теперь использует множители парирования вместо множителей самоусиления, поэтому парированные выстрелы бьют немного слабее, чем раньше."
  - bugfix: "Эффект «крованого опьянения» больше не дает бесконечных стаков сопротивления урону выносливости до полной иммунности и стаков уязвимости к давлению до такой степени, чтобы вас мгновенно убивало 600 единиц брут-урона за один тик при попытке открыть шлюз."
  - bugfix: "Окна TGUI, загрузка которых при первом открытии занимает более 4 секунд, больше не закрываются сами по себе."
  - rscadd: "Добавлено свечение глаз боргов и возможность его отключить."
  - bugfix: "Глаза боргов теперь отображаются корректно при переключении между z-уровнями."
  - rscadd: "Таблички стали более настраиваемыми и перенесены в меню лодаута."
  - balance: "В шкафчик капитана добавлен фонарик для единообразия с другими главами персонала."
  - bugfix: "Исправлена опция «Input: Enable TGUI» для текстовых полей ввода."
  - admin: "Overflayer снова показывает базовую плоскость и смещение для незарегистрированных плоскостей, которые он может декодировать."
  - bugfix: "Исправлено сообщение в чате при извлечении встроенных объектов из себя."
  - qol: "Меню лодаута теперь использует скины для выбора различных цветов федоры, ковбойских сапог и мягкой кепки."
  - bugfix: "Исправлено отсутствие кодовых слов у главного революционера."
  - bugfix: "Подбор специальных обувей (например, нескользящих) Церулеанами больше не ломает обувь навсегда."
  - code_imp: "Немного почищен рендеринг одежды, особенно в части спрайтов в руках; сообщайте о любых странностях."
  - code_imp: "Почищен код обуви Церулеанов; сообщайте о любых странностях."
  - bugfix: "Исправлены некоторые формы зомбификации, которые были неизлечимы."
  - bugfix: "Исправлена возможность выбросить проклятие «Багрового тесака» на поздних стадиях."
  - bugfix: "Потенциальный манифест в пре-гейм лобби обновляется, когда кто-то переходит в состояние «не готов»."
  - bugfix: "Исправлено распространение болезней по воздуху. Чихание, кашель и дыхание теперь распространяют болезни, если вы БЕЗ маски, а не если вы в ней."
  - bugfix: "Снова работает базовое ночное зрение (например, от генетической мутации)."
  - code_imp: "Меню крафта стало заметно быстрее, но сообщайте о любых странностях."
  - qol: "Осмотр незакрепленного сварочного аппарата теперь сообщает, что его топливный бак открыт и его можно закрутить; попытка зажечь его сообщает, что сначала нужно закрутить бак."
  - bugfix: "Исправлен редкий случай, когда ИИ мог застрять в поведении (из-за некорректной отмены декораторов)."
  - bugfix: "Скрытые действия (например, иконка шестеренки при краже шпиона) снова скрыты."
  - bugfix: "(Должно быть) исправлено мерцание полос прогресса красным или индикация завершения в неподходящие моменты."
  - bugfix: "Исправлено сливание энергии ниндзя напрямую из ячейки, которое работало только при неудачной попытке слива."
  - code_imp: "Горячая клавиша отмены взаимодействия стала менее «дерганой»; сообщайте о любых странностях."
  - bugfix: "Охват камер больше не ломается при взгляде вниз через стекло в нижней части многоуровневой зоны."
  - bugfix: "Предатели теперь действительно могут получать цели по захвату шаттла."
  - bugfix: "Исправлено отсутствие новых главных революционеров при позднем присоединении к революции."
  - bugfix: "Исправлено влияние адаптации к пустоте и темноте у генокрадов: теперь они замедляют химическую регенерацию, а не ускоряют её."
  - balance: "Пульсовые снаряды теперь обладают высоким пробитием брони. Также они движутся крайне быстро."
  - balance: "Пульсовые заряды наносят 40 единиц урона и имеют пробитие (AP) 30."
  - balance: "Рентгеновские лазеры теперь наносят 20 единиц урона вместо 15."
  - balance: "Гладкоствольные дезабилизаторы больше не являются неточными, наносят 45 единиц урона и движутся в два раза быстрее. Им все еще трудно пробить броню."
  - admin: "Администраторы теперь могут использовать команду «create black market item», чтобы продать помеченный объект на черном рынке."
  - bugfix: "Шаттлы пиратов, Синдиката и «белого корабля» (а также в некоторых других местах) теперь корректно спавнятся с перерезанными проводами взаимодействия ИИ на их АПЦ и шлюзах, что не дает ИИ и киборгам управлять ими, пока провода не будут починены."
  - bugfix: "Снова можно передавать предметы с помощью горячей клавиши."
  - bugfix: "Исправлено использование коричневой сетки в броне для подавления беспорядков (теперь она черная, в цвет брони)."
  - bugfix: "Дым от дымовых гранат или дымового заклинания священника снова вызывает негативный эффект при воздействии (кашель, легкий урон от нехватки кислорода, выронив предметы)."
  - bugfix: "Любители Хэллоуина, радуйтесь: исправлены некоторые древние баги Дуллаханов. Это касается их речи, взаимодействия в роли генокрада и восприятия мира."
  - bugfix: "Исправлена отмена развертывания костюма модификатора при движении."
  - bugfix: "Исправлен спящий процесс в рывке лобстросити."
  - bugfix: "Газовые баллоны теперь сохраняют правильное количество газа при разборке или объединении в группы."
  - rscadd: "Добавлена возможность нажать Alt + ПКМ по газоанализатору, чтобы он указал на ближайшую воздушную сигнализацию в текущей зоне."
  - qol: "Добавлены подсказки горячих клавиш при наведении мыши на мультитул и газоанализатор."