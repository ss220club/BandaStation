author: "tgstation"
delete-after: True
changes:
  - bugfix: "Деструктивный анализатор снова корректно разблокирует ветки исследований."
  - bugfix: "Исправлено отображение сломанных иконок в интерфейсе биогенератора."
  - bugfix: "В описании «Пепельных глаз» (Ashen Eyes) больше не указано, что они дают фокус."
  - rscadd: "Добавлена положительная особенность «Имитация смерти». Издав предсмертный хрип, вы теряете сознание, а любой, кто вас осмотрит, на короткое время решит, что вы скончались от полученных ран."
  - balance: "Вирусы с положительной степенью тяжести не исчезают при голодании."
  - balance: "Чувство сытости больше не влияет на естественное выздоровление от болезней."
  - qol: "В набор «Плотоядная кровь» (Carnivorous Blood) добавлена инструкция с разъяснением принципа действия этого компонента."
  - rscadd: "Добавляет настройку роста, позволяющую выбрать один из вариантов: «Низкий», «Средний» или «Высокий». Это не меняет рост поселенцев или косможителей."
  - bugfix: "Исправлен сброс роста до среднего значения, возникавший из-за манипуляций с ДНК (например, при использовании «Жала трансформации»)."
  - bugfix: "Руина «Гордость» больше не будет приводить к тому, что персонажи, стоящие над решетчатыми провалами, будут падать в обычные провалы."
  - qol: "Если нажать правой кнопкой мыши на раковину, держа в руке мензурку - она опустошится."
  - bugfix: "Исправлено взаимодействие швабры с раковиной."
  - rscadd: "Иногда внутри яблока бывает червяк."
  - qol: "Убрана запись о Кровавом черве (Bloodworm) из панели характеристик и перенесена на кнопку действия, также добавленоа соответствующее уведомление на экране."
  - bugfix: "Теперь сервер должен соблюдать параметры `min\\_antag\\_cap` и `max\\_antag\\_cap` из конфигурации для правил, применяемых в середине раунда."
  - rscadd: "Слаймолюди теперь способны протискиваться сквозь решетки и подобные преграды (однако они не могут проносить с собой аугментации или снаряжение)."
  - bugfix: "Исправлено два случая, когда нанесение урона обычным мобам, исчезающим после смерти, могло привести к ошибке времени выполнения."
  - bugfix: "Вы можете складывать диски на голодиски."
  - code_imp: "Добавляет поддержку удаления языкового ключа."
  - bugfix: "Ящерицы и животные с повреждениями мозга больше не страдают от непреднамеренных спонтанных аневризм."
  - bugfix: "Исправлен «синий экран» при создании цветового фильтра в Filterrific."
  - bugfix: "Использование сомнительных чипов навыков для выполнения сверхбыстрых переворотов опасно для температуры твоего организма."
  - bugfix: "Теперь неудачу приносит не каждый удар по зеркалу, а только его разбитие."
  - qol: "Ботинки клоуна больше не уничтожаются при смене комплектов снаряжения персонажа."
  - balance: "При рассеивании остатков эктоплазмы в руке ревенант затягивается в зеркало (дальность действия такая же, как при броске)."
  - rscadd: "Добавлены звуковые эффекты для выделенных сообщений в чате."
  - qol: "Теперь можно включить звуковые сигналы при выделении сообщений в чате."
  - sound: "Добавлен `sound/misc/highlight sounds/Beep.ogg`"
  - sound: "Добавлен звук капли пипетке."
  - bugfix: "Если снять реактивные ботинки во время полета, персонаж теперь оказывается на земле, а не «застревает» из-за ошибки."
  - bugfix: "Потоки частиц и деструктивные сканеры теперь отображаются на соответствующих слоях."
  - rscadd: "Плиточные варианты получили следующие полы: серебряный, золотой, алмазный, плазменный, урановый, бананиумный."
  - rscadd: "Серебряная и золотая плитки получили дополнительные варианты, изображающие соответственно луну и солнце."
  - rscadd: "Из следующих материалов теперь можно создавать уникальные полы: кости (8 вариантов), пласталь (6 вариантов), песчаник (4 варианта), блюспейс-кристалл (3 варианта), телекристалл (3 варианта), адамантий (2 варианта), металлический водород (2 варианта), хаунтий (2 варианта), рунит, митрил."
  - rscadd: "Из следующих материалов теперь можно создавать уникальные стены, в том числе фальшстены: кости, адамантий, рунит, металлический водород, хаунтий, митрил."
  - rscadd: "Из следующих материалов теперь можно изготовить уникальные ковры: шкура Голиафа, медвежья шкура, шкура белого медведя, чешуя карпа, чешуя ящерицы, мех моли, человеческая кожа."
  - rscadd: "Для песчаника была добавлена ​​опция заполнения стены, что позволяет создать два дополнительных типа стен."
  - rscadd: "Для всех подтипов деревянной плитки были добавлены светлые и тёмные варианты (всего 8 новых вариантов)."
  - rscadd: "Теперь мясные плитки реализованы должным образом и получили новый вариант, соответствующий вариантам костяных плиток."
  - rscadd: "Для имитации базальтовой плитки добавлены варианты с обычным, красным и «лунным» песком — и всё это можно разравнивать граблями! При этом используются уже имеющиеся в игре деревянные грабли."
  - rscadd: "Для напольного покрытия \"Recharge\" были добавлены варианты, сочетающиеся с другими стилями железного пола: белым, тёмным и гладким."
  - rscadd: "Бамбуковая плитка пришла в варианте, представляющем собой просто бамбук, а не циновку."
  - rscadd: "Добавлены плитки в стиле «нео». Чтобы их создать, возьмите 4 железные плитки для пола, а также масло, радий и фосфор из химической лаборатории. (4 варианта)"
  - rscadd: "Добавлены серебряно-золотые плитки. Чтобы их создать, возьмите по одному листу серебра и золота. (4 варианта)"
  - rscadd: "Добавлены плитки из пепельной кузницы. Для их создания понадобятся лист пластитана, большое количество пепла и фосфор (из химической лаборатории). (2 варианта)"
  - rscadd: "Добавлены плитки из цветного стекла. Для их создания понадобятся 40 стеклянных плиток, 20 железных стержней и мелок (кроме мелков мима и радужного). (8 видов)"
  - rscadd: "Пластиковая плитка получила вариант оформления в стиле детских игрушек-пазлов — с той самой китчевой эстетикой, свойственной пластиковым изделиям; теперь она корректно отображается в руках, а не выглядит как объект с отсутствующей текстурой."
  - refactor: "Код, отвечающий за крылья, был существенно переработан. Теперь любой орган типа «крыло» позволяет совершать полет любого уровня (определяемого соответствующей переменной). Пожалуйста, сообщайте о любых необъяснимых изменениях в поведении крыльев, если таковые обнаружатся в игре."
  - rscadd: "Специальные шаттлы для отделов! Если вы — капитан, а в одном из отделов работает больше всего сотрудников, вы можете приобрести такой шаттл через консоль связи."
  - code_imp: "Улучшен файл интерфейса BuyingShuttle."
  - rscdel: "Химический диспенсер: левый клик по подрецептам в браузере рецептов больше не закрепляет рецепт."
  - rscdel: "Химический диспенсер: нажатие правой кнопкой мыши на подрецепты в браузере рецептов больше не помещает рецепт в строку поиска."
  - qol: "Химический диспенсер: при наведении курсора на подрецепты - сам подрецепт отображается во всплывающей подсказке."
  - qol: "Химический диспенсер: можно навести курсор на всплывающие подсказки промежуточных рецептов, чтобы увидеть рецепты более низкого уровня (по аналогии с тем, как это реализовано в вики)."
  - qol: "Химический диспенсер: рецепт хлорида натрия теперь отображается в списке рецептов. На случай, если вы вдруг его забудете — хотя само название буквально и есть рецепт его приготовления."
  - refactor: "Механика появления монстров из рудных гейзеров на Лаваланде была полностью переработана."
  - rscadd: "Из рудных гейзеров на Лаваланде появляются волны мобов; чтобы продвинуться дальше, их необходимо полностью уничтожить."
  - qol: "Вентиляционные отверстия на Лаваланде теперь дают небольшой визуальный сигнал о том, где появятся мобы, ещё до их появления."
  - qol: "У мобов, появляющихся из рудных разломов, теперь над головой отображается визуальный индикатор, показывающий, нужно ли победить этого моба для завершения волны."
  - balance: "Теперь из вентиляционных отверстий появляются 5, 10 или 15 волн противников (по два типа в каждой), при этом сложность по-прежнему зависит от размера отверстия. Награда в виде шахтёрских очков, выдаваемая после отражения всех волн, была соответствующим образом скорректирована."
  - rscdel: "У дронов-узлов больше нет индикаторов прогресса, поскольку теперь ход выполнения волны отображается непосредственно для игрока по мере прохождения волн."
  - bugfix: "Мобы больше не появляются из вентиляционных отверстий прямо внутри стен."
  - bugfix: "Пульты от дверей работают на ближней дистанции."
  - bugfix: "Заменители света работают на ближней дистанции."
  - bugfix: "Исправлена ​​ошибка, из-за которой настройки Fancy Weather не применялись при смене уровня по оси Z."
  - balance: "Наблюдатели и легионы больше не продолжают смотреть на цель при отступлении, что позволяет наносить удары в спину."
  - bugfix: "если между объектами в прямой видимости находится более одного вентиляционного отверстия, дрон-узел не будет улетать, мгновенно проваливая защиту от волн."
  - rscadd: "Каждые 5 минут стоимость экспорта 2–4 случайных видов груза утраивается — lets go gambling!"