author: "tgstation"
delete-after: True
changes:
  - bugfix: "Лечение фруктового сока теперь работает корректно"
  - rscadd: "Руководители революции могут задать «рекомендацию по конвертации» — короткое сообщение, отправляемое каждому конвертируемому игроку через их интерфейс антагониста, чтобы привести революцию в порядок. Однако это, в конечном счёте, лишь *рекомендация*. Вам не навязывают её, но ожидается, что вы её соблюдёте."
  - qol: "Усиленные окна намекают, что их можно крепить при осмотре"
  - bugfix: "Окна из пластитаниума теперь находятся в правильном состоянии после постройки"
  - bugfix: "Кошки больше не пытаются убежать от себя самих после кошиной драки, а убегают от кошки, которая действительно победила"
  - bugfix: "Ревенанты больше не являются неуязвимыми для всех повреждений"
  - balance: "Пистолет .38 Truestrike теперь наносит 20 урона и имеет лучшую пробивную способность"
  - balance: "Копья больше не ломаются от переиспользования без ремонта"
  - bugfix: "Исправлено: существование боргов иногда приводило к краху меню орбиты"
  - qol: "Интерфейс ИИ при сбое теперь отображает количество в данный момент взломанных АПЦ"
  - bugfix: "Чат теперь прокручивается корректно при некоторых сообщениях с переносом строк"
  - bugfix: "Перемещение теплового зрения отдела смерти на их ИФФ-визоры"
  - spellcheck: "Тактические ЭФФ-визоры теперь называются ИФФ-визоры"
  - qol: "Участники отдела смерти больше не могут просматривать записи службы безопасности с помощью взгляда"
  - bugfix: "PDA психолога теперь можно окрашивать"
  - qol: "«PDA» в окрасчике PDA теперь называется «Assistant PDA», что действительно верно"
  - rscadd: "Добавлены нож-подушка и щит-матрас"
  - rscadd: "Нож-подушка наносит урон выносливости и позволяет заряжаться при вооружении: чтобы зарядить, просто продолжайте двигаться в одном направлении, это расходует выносливость, чем дольше вы бежите, тем больше расход"
  - rscadd: "Щит-матрас наносит урон выносливости и позволяет укрепляться, увеличивая вероятность блока и урон выносливости; щит легко ломается, так как остаётся матрасом"
  - rscadd: "Теперь можно купить нож-подушку и щит-матрас у продавца игрушек"
  - rscadd: "В обслуживании теперь есть шанс появления ножа-подушки и щита-матраса"
  - rscdel: "Ревенант больше не может влиять на консоль эвакуационного шаттла с помощью Сбоя"
  - bugfix: "Исправлено: ДНК-консоли могли печатать аномальные мутации"
  - bugfix: "Исправлено странное поведение, при котором список мутаций в ДНК-консоли сжимался до одной колонки"
  - balance: "Существа, подвергнутые остановке времени, теперь слегка более остановлены (химикаты перестают метаболизироваться, кровотечение приостанавливается и т.д.)"
  - balance: "Бомбы Синдиката больше не движутся к детонации при остановке времени"
  - refactor: "Небольшой рефакторинг функции timestop, в первую очередь его взаимодействия с голопаразитами — сообщайте о любых проблемах при следующем применении"
  - bugfix: "Установка связей SHIFT+номер теперь работает"
  - bugfix: "Плиты льдяной луны больше не учитываются в победе Блоба"
  - qol: "Сделаны проверки видимости Candela немного более мягкими"
  - bugfix: "Исправлено: светящиеся ядра модов могли не заряжаться от сети"
  - code_imp: "Оптимизация функции compare() за счёт добавления проверки суммарных молей"
  - qol: "Хвост автоматически прекращает движение губы, когда владелец теряет сознание или находится в критическом состоянии, а не при его смерти"
  - bugfix: "Мобы, брошенные из капсул, больше не имеют повреждённого ИИ, застрявшего на попытке сопротивляться"
  - sound: "Моды теперь издают звуки шагов"
  - sound: "Магнитные загрушки теперь издают звуки шагов"
  - sound: "Роботизированные конечности теперь издают звуки шагов (применяется только при ношании без обуви)"
  - sound: "При ударе, победе или разрушении роботизированных конечностей воспроизводится альтернативный звук"
  - image: "Откат/перерисовка нескольких стен и полов из проекта «floors and walls pr»"
  - bugfix: "Исправлено: некоторые частицы были невидимы на объектах на полу (или на полу самом)"
  - bugfix: "Игроки с местоимениями it/its больше не нарушают радиосообщения"
  - bugfix: "Исправлена инвертированная логика при отсечении связанного предмета"
  - bugfix: "pAИ снова имеют кнопки языка и навигации в своём интерфейсе"
  - bugfix: "ИИ больше не застревают в тяжёлом крите навсегда после возрождения"
  - bugfix: "Объявления о завершении радиационной бури теперь отображаются корректно"
  - bugfix: "Диспенсеры химикатов (и, возможно, несколько других мест) теперь корректно ограничивают текст при использовании `Input: Enable TGUI`"
  - rscadd: "Добавлены звуки удара для банок"
  - sound: "Добавлен звук can_hit.ogg"
  - rscadd: "Добавлена новая машина на трудовом лагере на Лаваленде: Produceporter. Отправляйте выращенные культуры персоналу обслуживания в обмен на трудовые очки!"
  - rscadd: "Пресс номерных знаков теперь начисляет 10 трудовых очков за каждый новый нажатый номер"
  - qol: "Консоль лагеря теперь может принимать ID заключённого прямо из руки"
  - sound: "Добавлены звуковые эффекты для пресса номерных знаков"
  - bugfix: "Мобы, захваченные агрессивным захватом и должные бежать с места, теперь делают это."