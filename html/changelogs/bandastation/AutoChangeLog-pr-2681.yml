author: "tgstation"
delete-after: True
changes:
  - bugfix: "Выпадающий список выбора перевозчика в меню \"День, когда вы приносите своих питомцев на работу\", теперь отображается."
  - bugfix: "Исправлена ошибка, из-за которой золотой червяк иногда создавал сломанный булыжник при ударе по боссовому вентилю."
  - bugfix: "Боссовые вентиляции теперь могут выдавать алмазы и блюспейс, как и положено."
  - qol: "Много, много, много разработок RND (в первую очередь компьютеров и машин) теперь имеют более информативные описания, объясняющие, что они делают, а не просто говорящие \"Это печатная плата\"."
  - spellcheck: "Осмотр PanD.E.M.I.C 2200, Sheet-meister 2000 или контроллера сервера R&D теперь читается как \"Это [вещь]\" вместо \"Это [вещь]\"."
  - spellcheck: "Кибернетические клыки больше не называются \"advanced\" в принтере."
  - bugfix: "Кибернетические клыки перенесены в \"боевые кибернетические органы\"."
  - bugfix: "Исправлено проблему, при которой подсказки на кнопках меню побега отображались позади самих кнопок."
  - balance: "CMO больше не начинает с игрой advanced health analyzer."
  - map: "[Icebox] Переработана Атмосферика. Ушла аллея боли."
  - map: "[Icebox] Переработаны служебные помещения вокруг Атмосферики и Науки."
  - image: "Добавлены длинные декали угловой разметки."
  - qol: "Оболочки ИИ теперь отображаются как \"off\", когда не управляются активно."
  - config: "Удален конфиг \"Disable mood\"."
  - rscadd: "Плазмамены, носящие костюм человеческой кожи, не будут загораться. Сам костюм горючий, поэтому убедитесь, что вы переоденете его под душем или чем-то подобным."
  - rscadd: "Дыхание миасмы может привести к болезням, аналогичным тем, что вы получаете от поедания грязной еды с пола."
  - code_imp: "Фиктивные персонажи имеют пустой настроение datum."
  - bugfix: "Антагонисты битраннеров снова могут Escape из emagged сервера."
  - rscadd: "Машины для сканирования блюспейс и приема газа."
  - rscadd: "Цепи для сканирования блюспейс и приема газа."
  - rscadd: "Добавлены сканер блюспейс и приемник газа в технологическую ветку."
  - rscadd: "Спрайты для сканера блюспейс и приемника газа."
  - rscadd: "Вы можете отсоединить сканеры, связанные с приемником, используя площец отвертку."
  - bugfix: "Исправлено отсутствие левой руки для корма для рыб, и ножовка должен теперь отображать свой значок в инвентаре, а также множество других случайных предметов, которые не были связаны с их существующими значками в инвентаре."
  - rscdel: "Иерофант: заклинание \"Crimson Cleave\" удалено."
  - rscadd: "Иерофант: добавлено \"The Crimson Cleaver\", знание четвертого уровня. Оружие, которое может резать и восстанавливать здоровье. Не-иерофанты могут использовать его за счёт своей души..."
  - rscadd: "Иерофант: добавлено \"Rhythmic Lodestone\", знание первого уровня, которое позволяет иерофанту отслеживать любые зачарованные объекты с помощью их живого сердца."
  - rscadd: "Иерофант: добавлено \"Blessed Poppy\", знание первого уровня, которое лечит раны и стабилизирует существ. Может быть использовано не-иерофантами."
  - rscadd: "Добавлены два новых постера с изображением бабочек, являющиеся контрабандой."
  - refactor: "Интерфейсы человек-машина и позитронные мозги были переписаны внутренне. Пожалуйста, сообщайте о любом неожиданном поведении."
  - balance: "Сейф-кейсы теперь легче открывать благодаря сокращениям в бюджете."
  - rscadd: "Реликвы теперь являются сборками — они могут быть подключены к проводам и соединены с другими сборками."
  - bugfix: "Эффект переключения измерений реликв теперь увеличивает кулдаун, как и задумано."
  - code_imp: "Добавлены эмissive эффекты для осколков суперматерии, газовых счетчиков, термомашин, устройств труб (фильтры, смешители, насосы, клапаны и т.д.), теплообменника циркулятора, СМЕС и генераторов PACMAN. Стандартный СМ теперь излучает свет даже при неактивном состоянии."
  - image: "Добавлены световые маски для осколков суперматерии, газовых счетчиков, термомашин, устройств труб (фильтры, смешители, насосы, клапаны и т.д.), теплообменника циркулятора, СМЕС и генераторов PACMAN."
  - bugfix: "Дверцы переносных переносчиков больше не перекрывают глаги + индикатор визуальной блокировки переносных переносчиков больше не сломан (он был сломан 2–5 лет)."
  - bugfix: "Все направленные эффекты света работают после извлечения из сумки."
  - bugfix: "Исправлено отображение консоли R&D, не показывающее имя того, кто добавил узел исследования."
  - bugfix: "Исправлено невозможность удалить узлы исследования, которые вы добавили."
  - bugfix: "Исправлено: раны больше не отключают конечности, когда они должны, и отключают их, когда они сшиты."
  - spellcheck: "\"gas pump\" переименован в \"pressure pump\"."
  - spellcheck: "\"volumetric gas pump\" переименован в \"volume pump\"."
  - spellcheck: "\"pressure valve\" переименован в \"pressure gate\"."
  - spellcheck: "В интерфейсе раздатчика труб: \"unary vent\" переименован в \"pump vent\"."
  - qol: "В интерфейсе раздатчика труб большинство компонентов теперь имеют подсказку, объясняющую, что они делают и как работают."
  - bugfix: "Исправлена ошибка времени выполнения/гонка с быстрыми и медленными шаттл-трейтами, не применяемыми, и исправлено начальное время выполнения, вызванное попыткой изменить уровни тревоги перед созданием шаттла."
  - rscadd: "Вы можете визуально определить, насколько кто-то мокрый, и эффект капания не отображается, если вы слегка мокрые."
  - bugfix: "Флешбенги теперь требуют защиты как глаз, так и ушей, чтобы смягчить их эффекты, а не только защиты ушей."
  - bugfix: "Объект портала теперь выровнен по своей коллизии."
  - rscadd: "Голосовые вывески теперь уязвимы для ЭМП."
  - image: "Электрогитара теперь может быть надета на слот спины и имеет значок для надетого состояния."
  - rscdel: "Удалена репутация предателя."
  - balance: "Мощные предметы предателя больше не имеют временных ограничений."
  - qol: "Устройства быстрой смены деталей теперь содержат значительно больше деталей, эквивалентно улучшенной версии с блюспейс."
  - bugfix: "Исправлено: TTS воспроизводится на сообщениях, которые недоступны для понимания."
  - code_imp: "Удалены неиспользуемые определения лёгких."
  - bugfix: "Вы можете продавать, а не покупать, Нитриум."