author: "tgstation"
delete-after: True
changes:
  - bugfix: "Средства излишков теперь отображают данные аплинка в конце раунда, если это возможно (например, вместо «Средство излишка: коробка» будет сообщено «Средство излишка: имплант скрытности»)."
  - balance: "Добавлен новый доступ: «Атмосферное оборудование», который управляет доступом к Воздухоударным тревогам, а также шкафам с атмосферным оборудованием и запасным пакетам. В будущем этот доступ может распространиться на некоторые участки карты (например, хранилище газов)."
  - balance: "Атмосферные техники, станционные инженеры и главный инженер по умолчанию имеют доступ «Атмосферного оборудования»."
  - balance: "Глава службы безопасности и Глава персонала больше не имеют доступа «Атмосферного оборудования», и поэтому не могут открыть воздухоударные тревоги по умолчанию."
  - balance: "Охранные инженеры получают доступ «Атмосферного оборудования» только на скелетных экипажах, и поэтому не могут открыть воздухоударные тревоги на более загруженных сменах."
  - bugfix: "Слова больше не вырываются из вашей замученной речи при использовании внутренних вопросительных знаков."
  - spellcheck: "Исправлены/отрегулированы орфография и грамматика нового контента Cerulean, включая гидролизатор, неутешимого музыканта, бронированную кожаную куртку, чёрное жемчужное ожерелье, прозрачный рыбий хвост и некоторые перки Cerulean (в меню вида)."
  - bugfix: "Несколько источников приглушённой речи теперь корректно учитывают друг друга."
  - bugfix: "Исправлено: звук SFX-событий больше не воспроизводится через звуковые токены как пустой."
  - bugfix: "Призраки могут прекратить следовать за целью, если орбита была передана на другого объекта, и пользователь отойдёт в сторону."
  - bugfix: "Список игроков в меню побега больше не отображает скрытых администраторов."
  - bugfix: "Голограммы больше не застревают в покачивании, если вы пройдёте сквозь них в момент исчезновения последнего глитча."
  - bugfix: "Исправлено: теперь можно скопировать ID-контроллеров задвижек."
  - balance: "Модуль скрытности MOD стал менее строгим к требованиям к деталям."
  - bugfix: "Ceruleans теперь могут активировать модули скрытности MOD."
  - bugfix: "Советы по обращению с кубами одиночных вознаграждений теперь достигают счёта сканера, и карго получает корректную оставшуюся сумму."
  - bugfix: "Стопки, созданные на автолатах и протолатах, сохраняют правильный состав материалов при пакетном воспроизведении или объединении с существующими стопками."
  - bugfix: "Исправлено: узлы Candela теперь работают с ресурсами, добываемыми с помощью сетчатин."
  - qol: "Кнопки действий с динамическими названиями (например, смена боевых искусств) теперь обновляют свои названия без необходимости наведения курсора заново."
  - bugfix: "Крафтовые револьверы теперь корректно переносят боеприпасы через пустые патронные камеры."
  - bugfix: "Копирование в режиме строительства на людях больше не искажает источник."
  - rscdel: "Убрана возможность карт проецировать стойку для оплаты."
  - rscdel: "Убрана функция vend-a-tray полностью."
  - rscadd: "Можно строить банкоматы из стекла или плазменного стекла (но не их усиленных вариантов). Банкоматы принимают маленькие наличные методы оплаты: монеты, наличные, холочипы, iou или... даже сигарету, конечно."
  - rscadd: "Добавлены банкоматы на кухню в баре, где раньше стояли vend-a-tray."
  - bugfix: "Щелчок правой кнопкой мыши по задвижке с энергией и топором больше не приводит к ошибке при открытии."
  - refactor: "Сеть NT Shopping больше не пересылает весь каталог карго каждую секунду, пока окно открыто."
  - qol: "Добавлен чат для трансляций."
  - rscadd: "У ниан теперь есть 2 дополнительных руки на грудной клетке, что делает их общее число рук равным четырём."
  - balance: "У ниан теперь повышена хрупкость в целом."
  - bugfix: "Akimbo неверно определял распыление, используя не то оружие."
  - bugfix: "Штраф Akimbo не учитывал оружие, которое стреляло."
  - balance: "Штраф Akimbo теперь использует множительную шкалу (двойной ПКА был скорректирован с учётом этого)."
  - bugfix: "Пойманные предметы теперь учитывают все пустые руки, а не только активную вторую."
  - balance: "Блокировка теперь работает только, если блокирующий предмет находится в активном наборе рук."
  - rscdel: "Перк «4 руки» у Волшебника и модификатор «смертная схватка» были удалены по техническим причинам. Извините за неудобства."
  - balance: "Охранники по отделам теперь распределены равномерно по отделам."
  - bugfix: "Вентиляция руды, загруженная после начала раунда или на уровне без центра добычи, теперь содержит руды и отображается на указателях вентилей."
  - rscdel: "Большинство крафтовых наборов для оружия удалены. Horizon и SKS всё ещё требуют один из них для создания."
  - rscadd: "Исследования технологий оружия теперь позволяют станции заказывать разблокированное оружие из карго (например, Advanced Energy Gun, X-ray gun, ion carbine и т. д.). Охрана может заказывать их оптом. Заказы приходят без патронов для запуска."
  - rscadd: "Теперь можно купить лазерный пистолет Hellfire напрямую из карго, хотя для этого потребуется перерезать контрабандный кабель."