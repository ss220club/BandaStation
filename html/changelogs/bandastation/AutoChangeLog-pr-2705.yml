  - rscadd: "На выбор в арсенал ГСБ было добавлено три новых орудия правосудия. Лазерный пистолет Х-02, пистолет PDH и GP-45 с отсечкой на два патрона."
  - rscadd: "На выбор в арсенал БЩ было добавлено три новых орудия для защиты глав. Термально-нанитовый пистолет, крупнокалиберный пистолет Ladon и пистолет GP-38."
  - balance: "СБ пояс в шкафу БЩ был заменен на пояс парамедика."
  - balance: "Добавлена кобура в шкаф БЩ."