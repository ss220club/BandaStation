author: "tgstation"
delete-after: True
changes:
  - rscadd: "Добавлены ящик с подушками и соответствующая категория в игровом торговом автомате."
  - rscadd: "Добавлены новые строки для ИИ VOX, в том числе «jellyperson», «cerulean», «worm», а также названия некоторых станций и профессий."
  - rscadd: "Добавлена возможность перемещаться по вентиляции (doorcrawl) для головных слизней (headslugs) и личинок ксеноморфов (alien larvae)."
  - balance: "Система осечек полностью переработана."
  - balance: "Патроны калибров .38 и .357 теперь взаимозаменяемы во всех совместимых видах оружия. Использовать ключ больше не требуется — достаточно зарядить оружие. Что может пойти не так?"
  - balance: "Хрупкие патроны (fragile rounds) снова относятся к патронам для дробовиков. Трубчатые пистолеты и пистолеты снова могут использовать патроны для дробовиков."
  - balance: "В оружии появилась механика давления, влияющая на обработку осечек. Внимательно проверяйте оружие, чтобы узнать допустимое для него давление."
  - balance: "Силиконы снова могут быть оглушены одной вспышкой (flash). На синдикатских боргов это изменение не распространяется."
  - bugfix: "Топливные баки с другими реагентами в смеси больше не пропускают взрывы в присутствии плазмы."
  - bugfix: "При замене бутылки в кулере с водой теперь можно забрать старую бутылку вместе с оставшейся в ней водой."
  - bugfix: "Pun Pun теперь должен корректно получать стартовые маски в предусмотренных случаях."
  - bugfix: "Пояса и взрывные копья больше не становятся невидимыми при ношении на спине."
  - bugfix: "Потеря грудных конечностей у moth больше не приводит к выпадению предмета из правой руки. Активная рука теперь корректно переключается на оставшуюся конечность."
  - bugfix: "Грудные руки moth теперь называются ожидаемым образом, а не просто «moth»."
  - bugfix: "При возрождении киборги теперь корректно отсоединяются от паранормального плана."
  - bugfix: "Исправлена ошибка, из-за которой инсулогены, полученные при изменении библии на инсулогенную, иногда исчезали."
  - bugfix: "Кубок Кьюанса больше не может заменять отсутствующие конечности."
  - bugfix: "Трансгуманист больше не может заменять отсутствующие конечности или органы."
  - bugfix: "Искусственные органы больше не могут заменять органы, которых у существа нет."
  - bugfix: "Искусственные органы больше не предоставляют лёгкие видам, которым не требуется кислород для дыхания."
  - bugfix: "Четверная ампутация больше не предоставляет конечности, которых у существа изначально нет."
  - bugfix: "Бумаги больше не раскрываются сами по себе, если после неудачной попытки прочитать их взять ручку или печать либо начать играть на музыкальном инструменте во время чтения."
  - bugfix: "Исправлено название библии: вместо «The holy book of default bible name» теперь отображается «The holy book of [имя вашего божества]»."
  - bugfix: "Комната отдыха и столовая тюрьмы на Icebox больше не вызывают пожарную тревогу при отсутствии проблем с атмосферой."
  - bugfix: "Исправлено отсутствие увеличения сопротивления урону у перка волшебника Heart Eater."
  - bugfix: "Ceruleans больше не падают и не дёргаются в невесомости."
  - bugfix: "Исправлена ошибка, из-за которой настроение могло застревать на значении, соответствующем комнате, в которую персонаж только что упал или телепортировался."
  - bugfix: "Духи Эйгенштейна больше не исчезают, когда кто-то проходит сквозь них."
  - bugfix: "Прохождение сквозь духа Эйгенштейна больше не вызывает странное смещение спрайта на пять минут."
  - bugfix: "Исправлены некорректные названия некоторых модулей MODsuit в панели действий."
  - bugfix: "Ссылка «был выбран» в объявлениях призрачного опроса теперь ведёт к выбранному игроку, а не в никуда."
  - bugfix: "Ношение космического или биологического скафандра без шлема больше не скрывает пол персонажа. Пол теперь скрывается при полном покрытии тела — например, при ношении скафандра с капюшоном или герметичного MODsuit."
  - bugfix: "Plasmamen, Ethereals, Shadowpeople и другие недиморфные виды больше не получают женский вариант нижнего белья."
  - refactor: "Переработаны кибернетические импланты рук. Сообщайте о необычном поведении и возможных ошибках на GitHub."
  - refactor: "(Производительность) Консоль НИОКР больше не пересылает всю технологическую сеть (techweb) каждую секунду, пока к ней подключён пользователь."
  - rscdel: "Старая картечь больше не разрушает оружие напрямую и не приводит к его внезапному исчезновению. Однако она всё ещё может испортить оружие, если кто-то зарядит в патрон слишком много пороха."
  - map: "TramStation: полностью переработана планировка атмосферного отдела, частично изменены инженерный отдел и коридор за пределами станции."
  - qol: "Выплёвывание содержимого рта больше не вызывает рвоту напрямую. Вместо этого оно теперь вызывает более выраженное отвращение."
  - qol: "Если выбрать Sitalesse или Sumalism в качестве религии капеллана, библия получит уникальное описание."
  - admin: "Прыжки по телу персонажа и телепортация к призраку больше не оставляют настроение застрявшим в месте, откуда был совершён прыжок."