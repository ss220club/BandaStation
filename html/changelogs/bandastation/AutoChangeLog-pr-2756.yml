author: "Ingakem"
delete-after: True
changes:
  - balance: "Модификатор урона у пистолета ГСБ GP-45М понижен до 0.6, чтобы не происходил даблтап всего живого."
  - balance: "Патроны для PDH 'Ladon' у БЩ теперь имеют свои уникальные пули, вместо понижения модификатора урона у самого пистолета."
  - rscadd: "Добавлена возможность создать магазины на ГП-38 БЩ, а также заказать их специализированные виды в карго."
  - rscadd: "Уника и Анаконда вернулись в витрину офиса ГСБ (вроде только на кибериаде), но с ними что-то произошло..."