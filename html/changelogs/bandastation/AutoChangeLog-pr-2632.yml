author: "Ingakem"
delete-after: True
changes:
  - balance: "АРГ теперь имеет автоматический режим огня, а также имеет возможность складывать и раскладывать приклад и имеет возможность установки глушителя с фонариком."
  - image: "Спрайты для револьверов .357, дробовиков, двухстволок, АРГ, УЗИ, ПП Saber, Томпсон, гранатомета и снайперской винтовки были заменены на новые."
  - image: "Добавлена возможность выбрать скин для ГП-9 из четырех вариантов."
  - qol: "На ВТ550 теперь можно установить фонарик и глушитель."