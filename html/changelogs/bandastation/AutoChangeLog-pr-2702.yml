author: "tgstation"
delete-after: True
changes:
  - bugfix: "В командной строке точные совпадения теперь корректно вызывают глагол"
  - bugfix: "Кавычки больше не обязательны вокруг аргументов в командной строке, что позволяет использовать кавычки в ваших сообщениях"
  - bugfix: "Удалено 100 глаголов поднятия из командной строки"
  - qol: "Добавлена настройка для отключения отображения автодополнения при вводе (если только вы не нажмёте пробел)"
  - bugfix: "Красные и синие кубы больше не связывают вас с вашим предыдущим транспортом"
  - bugfix: "Исправлена ошибка, из-за которой некоторые события с взвешенной случайностью могли работать неправильно"
  - qol: "Теперь вы можете прислоняться к джукбоксам"
  - bugfix: "Цвета недопустимых элементов лодаута теперь очищаются"
  - bugfix: "Исправлена проблема с повторяющимися звуками на устройствах, таких как плита/глубокожаровка, сообщайте о странных проблемах"
  - spellcheck: "Исправлено описание кастрюл"
  - bugfix: "Исправлена сбой при сингулярности с меченой объектами"
  - rscadd: "Добавлено свойство \"Самоуверенный\"! У вас всё получится!"
  - bugfix: "Исправлено некорректное масштабирование сообщений о жаре от дыхания"
  - bugfix: "Исправлено пропускание эффектов урона от температуры дыхания в крайне редких случаях"
  - refactor: "Небольшой рефакторинг кода проверки температуры дыхания для повышения скорости и чистоты"
  - bugfix: "Уровень света растений теперь отображается точно"
  - balance: "Взрывы наносят раны"
  - balance: "Взрывы учитывают защиту слуха"
  - balance: "Броня от бомб снижает урон от разрушительных взрывов"
  - balance: "Броня от бомб может снизить урон от взрывов до 60%, а не только до 50%"
  - balance: "Броня от бомб учитывает локацию и не всегда распределяет урон поровну"
  - balance: "Урон от разрушительных взрывов увеличен с 500 до 600"
  - balance: "Урон от разрушительных взрывов теперь разделён между brute и burn (вместо brute только)"
  - balance: "Разрушительные взрывы наносят урон слуху и паралич, если пережить"
  - bugfix: "Тяжёлые взрывы приглушают пришельцев, а лёгкие — нет"
  - spellcheck: "Подсказки сварных шлюзов больше не предлагают сварить их заново"
  - qol: "При попытке создать рецепт с составным компонентом, вы можете навести курсор на этот компонент, чтобы увидеть его рецепт. Если этот рецепт также имеет составной компонент, вы можете навести курсор на него и так далее, позволяя просматривать полные рецепты, не теряя место в интерфейсе"
  - qol: "Меню крафта еды больше не имеет третьей вкладки для \"типа еды\", вы можете вместо этого фильтровать по \"типу еды\" так же, как фильтруете по кухне или типу блюда слева"
  - qol: "Меню крафта еды теперь сообщает о дополнительных источниках ингредиентов, таких как из биогенератора"
  - balance: "Вместо прямого перевода денег на ваш счёт телефон Краб-17 теперь оснащён принтером, который периодически выдаёт банкноты"
  - code_imp: "Немного улучшена производительность работы, сообщайте о чём-то странном, что вы заметите (особенно с символами ударения)"
  - refactor: "Меню лобби теперь работает на клиенте, но должно выглядеть и функционировать идентично"
  - bugfix: "Исправлено: зажигательное устройство Кило Орднанс не зажигал"
  - map: "Незначительные изменения в устройствах труб Кило Орднанс"
  - bugfix: "Исправлено: TGUI вылетает при сбросе ключа по умолчанию без привязанного значения"
  - rscdel: "Удалено средство выбора ингредиентов из стартового снаряжения кухаря"
  - rscadd: "Добавлено кушанье в стартовое снаряжение кухаря, используйте его на консоли заказа продуктов, чтобы получить 10 бесплатных ингредиентов по выбору"
  - rscadd: "Отрегулирован лимит количества покупаемых предметов за заказ (добыча/бег с минералами/кухонные заказы). Раньше было плоское 20, но интерфейс иногда ошибочно показывал 50 или 10. Теперь лимит масштабируется прямо на основе стоимости предмета (дешёвые предметы позволяют делать оптовые заказы)"
  - bugfix: "Исправлено: наложение Seclite для пистолет с дисабиллером"
  - bugfix: "Большие крылья теперь полностью подвержены воздействию сетов брони или проклятия Voidwalker"
  - bugfix: "Пироги из сливок больше не подвержены воздействию сетов брони или проклятия Voidwalker"
  - refactor: "Небольшой рефакторинг отрисовки конечностей для исправления некоторых проблем с текстурами конечностей, сообщайте о чём-то странном, таком как отсутствующие наложения"
  - bugfix: "Исправлена утечка памяти в компоненте макета TGUI"
  - bugfix: "Ошибка в попытке снятия наручника больше не влияет на задержку клика вашей руки"
  - bugfix: "Исправлено: странное осввящение в некоторых коридорах в миссии NT Museum"
  - balance: "С пистолетами с синхронами можно закупить как отдельный набор из грузовых заказов"
  - image: "Плоты теперь отображаются на вашем спрайте"
  - sound: "Плоты теперь издают звук разрыва при наложении"
  - sound: "Швы теперь издают звук разрезания при наложении"
  - rscadd: "Плоты теперь могут быть всегда применены к любой конечности, больше не требуя раны (примечание: альтернативы плотам, такие как клейкая лента, всё ещё требуют раны)"
  - rscadd: "Плоты теперь можно удалить вручную, с вашего собственного тела или с тел других"
  - balance: "Плоты больше не удаляются при использовании, вместо этого они падают как \"использованные плоты\". Использованные плоты можно вымыть для повторного использования, но с убывающей эффективностью"
  - balance: "Если вы получите рану на уже заплаченную конечность, плоты получат значительный износ, возможно даже разрушение"
  - bugfix: "Агрессивные рапторы больше не слишком агрессивны"
  - code_imp: "Укус больше не может перепитывать вас"
  - code_imp: "Вы не лизнете людей как фелинид, если включён режим боя"
  - admin: "Asay теперь должен быть правильно очищен"
  - bugfix: "Исправлено: Runechat имел 1/256 шанс быть тёмным и почти неразборчивым"
  - spellcheck: "Исправлено: требования ритуалов Еретика не имели пробела перед \"или\""
  - balance: "Дроны NODE теперь иммунны к снеговым и золистым бурям, для пользы обороны волн"
  - bugfix: "Вентиляция руды теперь будет реже вызывать сбои"
  - rscadd: "Капканы теперь срабатывают, если вооружены и находятся внутри контейнеров или сумок (как мышиные ловушки)"
  - bugfix: "Команда \"knock\" теперь может открывать турельные панели"
  - bugfix: "Исправлено: масштабирование в браузере лобби"
  - rscadd: "Добавлены токсичные и радиоактивные эффекты при дыхании анти-ноблиума"
  - balance: "Дыхание вредных газов вызывает повреждение лёгких (масштабируется с парциальным давлением)"
  - balance: "Дыхание кислорода плазменцами теперь вызывает урон токсинами"