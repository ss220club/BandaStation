author: "tgstation"
delete-after: True
changes:
  - bugfix: "Импортированные настройки чата теперь сохраняются дольше одного раунда."
  - config: "Ссылка помощи для ревенантов теперь использует конфигурацию, а не жёстко закодированную ссылку."
  - refactor: "Каждому отображению icon_state модификаций туров данных свои собственные типы."
  - balance: "Огнестрельное оружие Dragonsbreath теперь можно распечатать с технологией Riot Suppression. Оно больше не крафтится."
  - balance: "Огнестрельные снаряды теперь вызывают возгорание в виде небольшого огненного шара для каждого попадания. Они больше не оставляют огненный след."
  - balance: "Огнестрельные снаряды теперь наносят больше урона самому снаряду."
  - balance: "Dragonsbreath также теперь отскакивает."
  - code_imp: "Правильно определяет путь к дизайну данных оружия Tesla Cannon как тесла-револвер, а не станновый револвер."
  - qol: "Динамический режим больше не появляется посередине раунда, когда вызван шаттл. (Ранее он избегал появления посередине раунда только если шаттл уже прошёл полпути к станции.)"
  - bugfix: "При вводе командной строки индикаторы мышления/ввода снова отображаются в игре."
  - balance: "Убирает скелетные ключи. Ящики с tendril можно просто открывать, как любые другие добычи мегафауны."
  - bugfix: "Исправлено: двуручное оружие не обновляется при вооружении."
  - bugfix: "Плиты Gibtonite больше не могут содержать руду внутри."
  - bugfix: "Вы сможете снова получить медицинский отчёт о награде от того же пациента после пятиминутного ожидания."
  - qol: "Вы больше не получаете майндшилд-эффект от того, что tendril-кишащий ashвокер ест, если вы сами не ashвокер."
  - bugfix: "Странный реактиватор теперь корректно устанавливается в подарках доставки ХОПа, если условия выполнены."
  - spellcheck: "Стандартизированы имена и аббревиатуры семьи быстрых устройств."
  - spellcheck: ","