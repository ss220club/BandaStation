author: "tgstation"
delete-after: True
changes:
  - bugfix: "ЭМП, попавшая в камеру, больше не отключает её навсегда от всех сетей (только временно)."
  - bugfix: "Использование ИИ «Перехода в сеть» больше не отключает камеры навсегда от некоторых сетей."
  - qol: "«Переход в сеть» незначительно обновлён: теперь отображает больше сетей, которые могут быть вам полезны."
  - bugfix: "Ночное освещение теперь действительно исчезает по окончании."
  - bugfix: "Выключенные источники света больше не учитываются как свет при теневой ходьбе и других проверках темноты, а перемещающиеся источники света учитываются там, где они на самом деле находятся."
  - qol: "Торговые автоматы снова принимают возвращённые товары, превышающие лимит продукции."
  - qol: "Добавляет горячие клавиши к переносному воздухоочистителю и переносному насосу. Они позволяют включать и выключать их, снимать их баки, а в случае насоса — максимизировать выходное давление."
  - rscadd: "Изменяет настой крысы на настой мыши, обновляя описание его внешнего вида и добавляя два визуальных органа."
  - image: "Добавляет спрайты ушей и хвоста мыши, при этом хвост может вилять."
  - code_imp: "Рендеринг внутренней части уха для кошачьих ушей теперь использует список слоёв вместо одного конкретного слоя."
  - code_imp: "Код взрыва пакета чипсов приведён в порядок — сообщайте о любых странностях с этой очень узкоспециализированной штукой, полагаю."
  - qol: "Существа, ползающие по вентиляциям, теперь могут определить, комфортна ли температура в вентканале, в который они заходят."
  - balance: "Личинки кровавого червя теперь могут видеть мобов, пока ползают по вентиляциям."
  - rscadd: "Теперь можно использовать молоток-клещ для подрыва снарядов 40 мм и корабельных пушек. Также можно сделать это с человеком, держащим такой снаряд, целясь ему в рот в небоевом режиме."
  - qol: "Значки гордости теперь называются по своему оформлению вместо обычного «значка гордости»."
  - balance: "Тиризен предотвращает восстановление выносливости."
  - balance: "Пользователи телекинеза больше не могут открыть интерфейс на объекте, позволить ему покинуть их зону зрения и бесконечно его редактировать."
  - bugfix: "Исправлен харддел в коде щупалец Голиафа."
  - rscadd: "Добавлены ожоговые и тупые раны для роботизированных частей тела."
  - rscadd: "Добавлен новый реагент — охладитель для роботизированных ожогов."
  - map: "В робототехнику добавлен спрей охлаждающего средства (для роботизированных ожоговых ран)."
  - code_imp: "Удалены магические строки из текста требуемых состояний операции по ремонту костей."
  - code_imp: "Вентиляции должны работать лучше. Замечайте любые проблемы с вентиляциями, особенно при разгоне."
  - bugfix: "Файловый менеджер NTOS больше нельзя использовать для печати плюшевых карпов (и подобных вещей)."
  - code_imp: "Код для мобов, горящих, пока привязаны к трубам теплообмена, приведён в порядок. Сообщайте о любых странностях, если это не заработает в следующий раз, когда представится возможность попробовать, примерно через 8 месяцев."
  - admin: "Создание экземпляров датума из скриптов Lua больше не может использоваться для обхода защит админ-процедур."
  - bugfix: "Защита от ЭМП работает более надёжно."
  - balance: "Стоимость черты «Метательная рука» снижена (7 → 5)."
  - balance: "Шанс получения нескольких предметов почты, связанных с чертами, несколько снижен, за исключением черты «Игрок» (которая теперь в два раза вероятна)."
  - rscadd: "Добавлена черта «Эксцентричный корреспондент», которая добавляет больше случайности в пул предметов почты."
  - rscadd: "Добавлена черта «Хорошие связи», которая предлагает скидки на заказы груза или чёрного рынка."
  - rscadd: "Добавлена черта «Шоковый рефлекс», которая снижает шанс получить удар током при неудачном взломе или подобном."
  - rscdel: "Контейнер для транспортировки органов удалён из пула предметов почты черт «Протезный орган» и «Жестянщик»."
  - rscadd: "Кувалда теперь метаемая."
  - rscadd: "Телеэкраны и дисплеи состояния теперь можно сломать."
  - image: "Спрайты кувалд от Simpleton."
  - bugfix: "Органические конечности больше не могут получать тупые раны роботов 1 уровня (ослабленные винты)."
  - bugfix: "Выращиватели конечностей больше не препятствуют печати, если они улучшены и имеют достаточно реактивов, даже если без улучшений у них бы их не хватило."
  - bugfix: "Кнопка чата OOC отсутствует на вкладке OOC."
  - bugfix: "Превращения генокрада и экспериментальные клонаторы теперь правильно копируют высоту тона TTS цели."
  - bugfix: "Пользователи телекинеза должны иметь возможность использовать интерфейсы, даже находясь внутри техники, если от их клиента ожидается, что он сможет видеть это (одним или иным образом)."