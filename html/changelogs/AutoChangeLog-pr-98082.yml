author: "headband0536"
delete-after: True
changes:
  - bugfix: "Cuffed items no longer lag the server when their owner travels through vents or disposals. The item now goes along with its owner into vents, disposals, closets and mechs."
  - bugfix: "The chain of a cuffed item no longer stretches across the map when its owner is inside something."
  - bugfix: "Cuffed items on the floor follow their owner smoothly."
  - bugfix: "You can remove someone's cuffed item from the strip menu when it is not in their hand."
  - bugfix: "Naked-only ventcrawlers can't enter vents while chained to an item."