[mcp_servers.bandastation-ripgrep]
command = "{{NODE}}"
args = ["{{WORKSPACE}}/tools/agents/ripgrep-mcp.cjs"]
cwd = "{{WORKSPACE}}"
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 30
enabled_tools = ["search", "list-files", "count-matches", "list-file-types"]

[mcp_servers.bandastation-browser]
command = "{{NODE}}"
args = ["{{WORKSPACE}}/tools/agents/playwright-mcp.cjs"]
