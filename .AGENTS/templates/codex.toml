enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled_tools = [
  "browser_navigate", "browser_navigate_back", "browser_snapshot",
  "browser_take_screenshot", "browser_resize", "browser_click",
  "browser_drag", "browser_hover", "browser_type", "browser_press_key",
  "browser_select_option", "browser_fill_form", "browser_file_upload",
  "browser_handle_dialog", "browser_wait_for", "browser_evaluate",
  "browser_console_messages", "browser_network_requests",
  "browser_tabs", "browser_close"
]
